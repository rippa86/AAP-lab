---
- name: System Audit & Reporting Lab
  hosts: all
  gather_facts: true

  vars:
    #env_name: "development"
    #user_name: "david"
    #dest_path: "/tmp/{{ user_name }}_report.txt"

  tasks:
    # BAD PRACTICE! Remember to use the full collection path. 
    - name: ping host
      ping: 
      register: ping_result
        
    - name: Display target host banner
      ansible.builtin.debug:
        msg: "Application Info {{ ansible_facts['hostname'] }} ({{ ansible_facts['os_family'] }}) for {{ user_name | capitalize }}..."

    - name: Evaluate ping result status
      ansible.builtin.set_fact:
        ping_status: "{{ ping_result }}"

    - name: Generate system report from Jinja2 template
      ansible.builtin.template:
        src: templates/system_report.j2
        dest: "{{ dest_path }}"
        mode: '0644'

    - name: Read generated report file
      ansible.builtin.slurp:
        src: "{{ dest_path }}"
      register: report_contents

    - name: Debug report to terminal
      ansible.builtin.debug:
        msg: "{{ (report_contents.content | b64decode).splitlines() }}"

    - name: Set stats for downstream AAP workflow templates
      ansible.builtin.set_stats:
        data:
          vcpu: "{{ ansible_facts['processor_vcpus'] | default(ansible_facts['processor_count']) }}"
          memory: "{{ (ansible_facts['memtotal_mb'] / 1024) | round(2) }}"
          OS: "{{ ansible_facts['os_family'] }}"
    
    - name: debug variable information
      ansible.builtin.debug:
        msg:
          - "AAP WORKFLOW  VARS:"
          - "vCPU:   {{ ansible_facts['processor_vcpus'] | default(ansible_facts['processor_count']) }}"
          - "Memory: {{ (ansible_facts['memtotal_mb'] / 1024) | round(2) }} GB"
          - "OS:     {{ ansible_facts['os_family'] }}"
      tags:
        - insights
